<!doctype html><html lang="en"><meta charset="utf-8"><title>WhatsApp fixture</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#25362d;background:#e9efe9;height:100vh;display:flex}.sidebar{width:300px;background:#fff;border-right:1px solid #d9e3dc;padding:25px 18px}.sidebar h1{font-size:24px}.search{background:#f2f6f3;border-radius:20px;padding:13px;color:#819085}.chat{display:block;width:100%;border:0;background:#e5f2e9;border-radius:12px;padding:18px;text-align:left;font:inherit;margin-top:20px;cursor:pointer}.chat small{display:block;color:#6e8475;margin-top:5px}#main{flex:1;display:flex;flex-direction:column;min-width:0}header{height:76px;background:#f8faf8;padding:17px 25px;border-bottom:1px solid #dbe3db}header small{display:block;font-size:11px;color:#74927e;margin-top:3px}.messages{flex:1;overflow:auto;padding:35px 50px;background:radial-gradient(#8ab09417 1px,transparent 1px);background-size:18px 18px}.message{padding:12px 15px;background:#fff;border-radius:12px;max-width:80%;width:fit-content;margin-bottom:20px;box-shadow:0 1px 1px #18261c10;line-height:1.5}.message.out{margin-left:auto;background:#d9f5c9}footer{background:#f7faf6;padding:28px 24px 16px;display:flex;gap:10px;align-items:end}footer [role=textbox]{border:1px solid #dce5dc;border-radius:12px;background:white;flex:1;min-height:44px;max-height:180px;overflow:auto;padding:11px 16px;outline:0;white-space:pre-wrap;font:15px/22px system-ui}button.send{border:0;border-radius:50%;background:#28734d;color:#fff;width:42px;height:42px}#tools{padding:15px;font-size:12px}#tools button{margin:5px;padding:8px;border:1px solid #c4d5c7;border-radius:6px;background:#fff;cursor:pointer}.fixture-label{font-size:11px;color:#64816a;border:1px solid #d8e3d9;border-radius:8px;padding:10px;margin-top:25px}
.rail{width:64px;flex-shrink:0;background:#1d1f1f;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}.rail button{width:40px;height:40px;border:0;border-radius:50%;background:none;color:#a6aaaa;font-size:20px}.rail .spacer{flex:1}.sidebar{width:360px;background:#161717;border-color:#303333;color:#fafafa}body{background:#111;color:#fafafa}.search,.chat{background:#242626;color:#fafafa}#main header{background:#161717;border-color:#303333;display:flex;align-items:center}#main header>div:first-child{flex:1}.messages{background-color:#0b141a}.message{background:#202c33}.message.out{background:#005c4b}footer{background:#161717}footer [role=textbox]{background:#242626;color:#fafafa;border-color:#303333}#tools button{background:#242626;color:#fafafa;border-color:#303333}
</style><nav class="rail" aria-label="WhatsApp"><button data-navbar-item="true" aria-label="Chats">▤</button><button data-navbar-item="true" aria-label="Calls">♧</button><button data-navbar-item="true" aria-label="Status">◉</button><button data-navbar-item="true" aria-label="Communities">♧</button><div class="spacer"></div><button data-navbar-item="true" aria-label="Media">▧</button><button data-navbar-item="true" aria-label="You">◯</button></nav><div class="sidebar" id="pane-side"><h1>Chats</h1><div class="search">Search conversations</div><button class="chat" id="friend" aria-selected="true">Alex<small>See you this evening?</small></button><button class="chat" id="group">Weekend plans<small>A group conversation</small></button><p class="fixture-label">Local fixture · No account or network. Nothing here sends to WhatsApp.</p><div id="tools"><button id="incoming">Simulate incoming</button><button id="sticker">Load sticker</button><button id="replace">Replace composer</button></div></div>
<div id="main"><header><div><span data-testid="conversation-info-header-chat-title" title="Alex">Alex</span><small>Local demo conversation</small></div><button aria-label="Chat menu">⋮</button></header><div class="messages" data-testid="conversation-panel-messages"><div class="message" data-id="false_123456@c.us_a"><span class="selectable-text copyable-text">Hey! Want to grab a coffee this evening?</span></div><div class="message out" data-id="true_123456@c.us_b"><span class="selectable-text copyable-text">That sounds good, I’m free after six.</span></div><div class="message" data-id="false_123456@c.us_c"><span class="selectable-text copyable-text">Perfect, the usual place at 6:30?</span></div></div><footer><div contenteditable="true" role="textbox" aria-label="Type a message"></div></footer></div>
<script>
let peer='123456@c.us', sequence=0; window.fixtureSent=[];
function add(text,outgoing=false){const div=document.createElement('div');div.className='message'+(outgoing?' out':'');div.dataset.id=(outgoing?'true_':'false_')+peer+'_'+(++sequence);const span=document.createElement('span');span.className='selectable-text copyable-text';span.textContent=text;div.append(span);document.querySelector('.messages').append(div);div.scrollIntoView();}
function send(){const editor=document.querySelector('[role=textbox]');if(editor.innerText.trim()){window.fixtureSent.push(editor.innerText);add(editor.innerText,true);editor.innerText='';updateSend();}}
function updateSend(){const editor=document.querySelector('[role=textbox]'), existing=document.querySelector('.send');if(editor.innerText.trim()&&!existing){const button=document.createElement('button');button.className='send';button.setAttribute('aria-label','Send');button.innerHTML='<span data-icon="send">➤</span>';button.onclick=send;document.querySelector('footer').append(button);}else if(!editor.innerText.trim()){existing?.remove();}}
document.addEventListener('input',e=>{if(e.target.matches('[role=textbox]'))setTimeout(updateSend,100);});
document.addEventListener('keydown',e=>{if(e.target.matches('[role=textbox]')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
document.querySelector('#incoming').onclick=()=>add('See you soon! '+(++sequence));
function chat(group){document.querySelector('#friend').setAttribute('aria-selected',String(!group));document.querySelector('#group').setAttribute('aria-selected',String(group));peer=group?'999999@g.us':'123456@c.us';const name=group?'Weekend plans':'Alex';document.querySelector('header span').title=name;document.querySelector('header span').textContent=name;document.querySelector('.messages').replaceChildren();document.querySelector('[role=textbox]').textContent='';add(group?'Who is coming on Saturday?':'See you this evening?');}
document.querySelector('#friend').onclick=()=>chat(false);document.querySelector('#group').onclick=()=>chat(true);
document.querySelector('#replace').onclick=()=>{const old=document.querySelector('[role=textbox]');old.replaceWith(old.cloneNode());};
document.querySelector('#sticker').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=160;canvas.height=160;const ctx=canvas.getContext('2d');ctx.fillStyle='#ffcf66';ctx.beginPath();ctx.arc(80,80,68,0,Math.PI*2);ctx.fill();ctx.font='80px system-ui';ctx.fillStyle='#705324';ctx.fillText('☺',35,107);const img=document.createElement('img');img.alt='sticker';img.src=canvas.toDataURL('image/webp');img.width=100;window.fixtureStickerSource=img.src;document.querySelector('.messages').append(img);};

window.fixtureStickerSent=[];
const pickerTrigger=document.createElement('button');pickerTrigger.setAttribute('aria-label','Emojis, GIFs, Stickers');pickerTrigger.textContent='☺';
pickerTrigger.onclick=()=>{
  const existing=document.querySelector('#expressions-panel-container');if(existing){existing.remove();return;}
  // Match WhatsApp's portal/animated wrapper, which naturally overlaps the chat list.
  const portal=document.createElement('div');portal.id='expressions-panel-container';
  const wrapper=document.createElement('div');wrapper.style.cssText=`position:fixed;left:${document.querySelector('#main').getBoundingClientRect().left-200}px;bottom:90px;width:560px;max-width:560px;transform:scale(.7);transform-origin:center bottom;overflow:hidden;z-index:10`;
  const picker=document.createElement('ul');picker.dataset.testid='expressions-panel';picker.style.cssText='margin:0;width:100%;height:210px;background:#242626;border:1px solid #303333;padding:16px';
  for(const [testid,label] of [['expressions-btn-sticker','Stickers selector'],['panel-starred','Favorite'],['panel-recent','Recent']]){
    const tab=document.createElement('button');tab.dataset.testid=testid;tab.setAttribute('aria-label',label);tab.setAttribute('aria-selected','true');tab.textContent=label;picker.append(tab);
  }
  // Keep the rendered category container present even when its collection is empty.
  const content=document.createElement('div');content.setAttribute('role','list');picker.append(content);
  if(window.fixtureStickerSource&&!window.fixtureHideSticker){
    const send=document.createElement('button');send.setAttribute('aria-label','Send sticker');
    const item=document.createElement('span');item.dataset.testid='sticker-item';
    const img=document.createElement('img');img.alt='sticker';img.src=window.fixtureStickerSource;img.width=100;item.append(img);send.append(item);
    send.onclick=()=>{window.fixtureStickerSent.push({source:img.src,peer});};content.append(send);
  }
  wrapper.append(picker);portal.append(wrapper);document.body.append(portal);
  requestAnimationFrame(()=>{wrapper.style.transition='transform .2s';wrapper.style.transform='scale(1)';});
};document.querySelector('footer').prepend(pickerTrigger);
</script></html>
